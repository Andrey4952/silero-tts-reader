[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silero-tts-reader"
version = "1.0.0"
description = "Text-to-speech reader using Silero TTS with global hotkeys and system tray"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
speed = ["pyrubberband>=0.3.0"]

[project.scripts]
silero-tts-reader = "silero_tts_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silero_tts_reader*"]

[tool.setuptools.package-data]
silero_tts_reader = ["assets/*"]
